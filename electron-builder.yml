appId: com.vona.yoga
productName: VONA
copyright: VONA Personal Yoga Studio

directories:
  output: release
  buildResources: public

# Only the offline desktop runtime + the prebuilt SPA are shipped.
files:
  - electron/**/*
  - dist/client/**/*
  - package.json
  - node_modules/**/*
  - "!**/*.map"


# better-sqlite3 is a native module and must stay outside the asar archive.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

npmRebuild: true

mac:
  category: public.app-category.healthcare-fitness
  target:
    - target: dmg
      arch:
        - arm64
  darkModeSupport: false
  # Unsigned local build — no Apple Developer account required.
  identity: null
  gatekeeperAssess: false
  icon: public/icon.png
  extendInfo:
    CFBundleName: VONA
    CFBundleDisplayName: VONA

dmg:
  title: VONA
  artifactName: VONA-${version}-${arch}.dmg
  icon: public/icon.png
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
